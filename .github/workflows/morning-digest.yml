name: Morning digest

on:
  schedule:
    # GitHub cron is UTC. This runs once daily at 07:35 Europe/Warsaw during DST
    # and at 06:35 during standard time; GitHub Actions has no DST-aware cron.
    - cron: '35 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run pre-generation tests
        run: python -m pytest

      - name: Generate structured digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          MAX_WEB_SEARCHES: '6'
          MIN_DIGEST_ITEMS: '20'
          MAX_DIGEST_ITEMS: '25'
        run: python scripts/generate_digest.py

      - name: Render and validate static site
        run: |
          python scripts/validate.py
          python scripts/render.py
          python -m pytest

      - name: Commit generated edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'morning-signal[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data archive index.html assets/style.css
          git diff --cached --quiet || git commit -m "content: publish morning signal digest"
          git push
          gh workflow run pages.yml --ref main
