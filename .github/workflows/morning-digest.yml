name: Morning digest

on:
  schedule:
    # GitHub cron is UTC. These two entries cover 07:35 Europe/Warsaw in both DST modes;
    # the guard below makes only the locally-correct invocation publish.
    - cron: '35 5 * * *'
    - cron: '35 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check scheduled local time
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo('Europe/Warsaw'))
          print(f'Europe/Warsaw: {now.isoformat()}')
          if now.hour != 7 or now.minute not in range(30, 41):
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write('MORNING_SIGNAL_NOT_DUE=true\n')
          PY

      - name: Run pre-generation tests
        if: env.MORNING_SIGNAL_NOT_DUE != 'true'
        run: python -m pytest

      - name: Generate structured digest
        if: env.MORNING_SIGNAL_NOT_DUE != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          MAX_WEB_SEARCHES: '6'
          MIN_DIGEST_ITEMS: '20'
          MAX_DIGEST_ITEMS: '25'
        run: python scripts/generate_digest.py

      - name: Render and validate static site
        if: env.MORNING_SIGNAL_NOT_DUE != 'true'
        run: |
          python scripts/validate.py
          python scripts/render.py
          python -m pytest

      - name: Commit generated edition
        if: env.MORNING_SIGNAL_NOT_DUE != 'true'
        run: |
          git config user.name 'morning-signal[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data archive index.html assets/style.css
          git diff --cached --quiet || git commit -m "content: publish morning signal digest"
          git push
